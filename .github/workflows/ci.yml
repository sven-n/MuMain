name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 18 * * *' # 02:17 UTC+8
  workflow_dispatch:

concurrency:
  # A PR's newer push cancels its older run. Main pushes and releases finish the running revision and keep only the
  # newest pending trigger: a main push saves the caches PRs start from, and its Windows and macOS builds take long
  # enough that a day of merges would otherwise cancel most of them before they save anything.
  group: ci-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # actions/checkout runs git init and then checks out a detached commit; without these settings git prints a hint
  # about the initial branch name and an advice block about detached HEADs in every job. Git reads them from the
  # environment (GIT_CONFIG_COUNT), so they need no step.
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: 'false'

jobs:
  quality:
    name: Quality Gates
    # The image by name, not ubuntu-latest: GitHub moves repositories to a new latest image one by one, and its
    # cppcheck and GCC report different findings and warnings.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Select native builds looks up the commit main's last successful run built (scripts/ci_build_plan.py).
      actions: read
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      release: ${{ steps.plan.outputs.release }}

    steps:
      # Game data except what the gates read (RmlUi documents, fonts, Dec2.dat) is about 700 MB that only the native
      # tests use; downloading it took 30 s to 3 min depending on GitHub.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A pull request diffs against the merge commit's first parent, so it needs only one commit of history.
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/bin/*
            /src/bin/fonts/
            /src/bin/Data/
            !/src/bin/Data/*
            /src/bin/Data/Interface/
            /src/bin/Data/Dec2.dat

      # Commits, tags and file lists for the diffs and release check, without every past asset version; git fetches
      # the few old file versions a diff needs on demand.
      - name: Fetch history
        if: github.event_name != 'pull_request'
        run: git fetch --quiet --filter=blob:none --unshallow --tags origin

      - name: Select native builds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_build_plan.py

      # Architecture guards and contracts that only read the source; native jobs skip the `static` label.
      - name: Run static checks
        run: |
          cmake -S tests/static -B out/static-checks
          ctest --test-dir out/static-checks -C Release --parallel 4 --output-on-failure --no-tests=error

      - name: Validate game data inputs
        run: |
          test -f src/bin/Data/Dec2.dat
          test -f src/bin/fonts/DejaVuSans.ttf

      - name: Cache quality tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
          key: quality-tools-pip-${{ runner.os }}-v1
          restore-keys: quality-tools-pip-${{ runner.os }}-

      - name: Install quality tools
        run: |
          which cppcheck || { sudo apt-get update && sudo apt-get install -y cppcheck; }
          pip install clang-format==21.1.8

      - name: Detect changed C++ files
        id: changed
        env:
          DIFF_BASE: ${{ steps.plan.outputs.diff_base }}
        run: |
          CHANGED=$(bash scripts/changed_cpp_files.sh "$DIFF_BASE")
          echo "diff_base=$DIFF_BASE" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No C++ files changed"
          else
            COUNT=$(echo "$CHANGED" | wc -l | tr -d ' ')
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" > /tmp/changed-cpp-files.txt
            echo "$COUNT C++ files changed"
          fi

      - name: Check formatting
        if: steps.changed.outputs.count != '0'
        run: |
          echo "Checking ${{ steps.changed.outputs.count }} files..."
          bash scripts/check_format.sh "${{ steps.changed.outputs.diff_base }}" < /tmp/changed-cpp-files.txt

      - name: Static analysis
        if: steps.changed.outputs.count != '0'
        run: |
          echo "Linting ${{ steps.changed.outputs.count }} files..."
          cat /tmp/changed-cpp-files.txt | xargs cppcheck \
            -j$(nproc) \
            --max-configs=1 \
            --error-exitcode=1 \
            --enable=warning,performance,portability \
            --std=c++20 \
            --language=c++ \
            --suppress=missingInclude \
            --suppress=unmatchedSuppression \
            --suppress=unusedFunction \
            --suppress=*:*/ThirdParty/* \
            --suppress=useInitializationList \
            --suppress=passedByValue \
            --suppress=postfixOperator \
            --suppress=returnByReference \
            --suppress=uninitMemberVar \
            --suppress=uninitMemberVarNoCtor \
            --inline-suppr

  build-windows:
    name: Windows Native Build (x64, Release, editor OFF)
    needs: quality
    if: needs.quality.outputs.windows == 'true'
    # By name, as Quality Gates: another image brings another MSVC, and GitHub warns in every job while it moves
    # windows-latest to a new one.
    runs-on: windows-2025-vs2026
    # A cold build, e.g. after a runner image brings a new cl.exe, took 64 minutes: vcpkg 18, the build 41.
    timeout-minutes: 120
    outputs:
      caches-read-at: ${{ steps.caches_read.outputs.at }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      # MSVC's objects carry their debug info (/Z7, see src/CMakeLists.txt): one build's take about 0.5 GB.
      CCACHE_MAXSIZE: 1500M

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Loads vcvars64.bat and passes every variable it changes on to the following steps, as Fork CI does
      # (ilammy/msvc-dev-cmd, used before, still runs on the deprecated Node.js 20).
      - name: Activate Visual Studio developer environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "No Visual Studio installation with the x64 C++ tools found."
          }
          $vcvars = Join-Path $installation "VC\Auxiliary\Build\vcvars64.bat"
          # vcvars64.bat looks for vswhere.exe on PATH itself.
          $env:PATH = "$(Split-Path $vswhere);$env:PATH"
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if ($LASTEXITCODE -ne 0) {
            throw "vcvars64.bat failed."
          }

      - name: Assert MSVC developer environment
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $linker = (Get-Command link.exe -ErrorAction Stop).Source
          $compilerIdentity = (& $compiler /? 2>&1 | Out-String)
          $linkerIdentity = (& $linker /? 2>&1 | Out-String)

          Write-Host "cl.exe:   $compiler"
          Write-Host "link.exe: $linker"

          if ($compilerIdentity -notmatch 'Microsoft \(R\) C/C\+\+ Optimizing Compiler') {
            throw "cl.exe is not the Microsoft C/C++ compiler."
          }
          if ($compilerIdentity -notmatch 'for x64') {
            throw "cl.exe does not target x64."
          }
          if ($linkerIdentity -notmatch 'Microsoft \(R\) Incremental Linker') {
            throw "link.exe is not the Microsoft linker."
          }
          exit 0

      - name: Install compiler cache
        # The runner image has no ccache. Its release for Windows, checked against the SHA-256 the release lists; a
        # download that fails is sent again, as a brief GitHub error would otherwise fail every Windows job meanwhile.
        shell: pwsh
        run: |
          $version = '4.14.2'
          $sha256 = '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84'
          $name = "ccache-$version-windows-x86_64"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$version/$name.zip" -OutFile $archive `
            -MaximumRetryCount 3 -RetryIntervalSec 10
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $sha256) {
            throw "$name.zip does not match its SHA-256."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP $name | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Identify vcpkg toolchain
        id: vcpkg
        # Its compiler output, the start of cl.exe's SHA-256, also names the compiler cache.
        shell: pwsh
        run: ./scripts/ci_vcpkg_cache_key.ps1

      - name: Cache Windows compilation
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-x64-${{ steps.vcpkg.outputs.compiler }}-${{ github.sha }}
          restore-keys: ccache-windows-x64-${{ steps.vcpkg.outputs.compiler }}-

      - name: Restore dependencies
        id: deps
        # The key names what picks these files: the root CMakeLists.txt declares the libraries, cmake/patches changes
        # their sources, and the ClientLibrary projects and the .NET SDK pick the NuGet packages (the SDK's version
        # picks those of its NativeAOT compiler). src/CMakeLists.txt is not part of it: it changes with every new
        # source file of the game. Only main pushes save it (Save dependencies): a PR's own copy would serve that PR
        # alone and push main's entries out of the 10 GB cache. One kind of run saves each cache, so its newest entry,
        # the one the prune job keeps, is always the newest commit's.
        uses: actions/cache/restore@v6
        with:
          path: |
            # Downloaded sources only: ninja recompiles restored *-build folders.
            out/build/windows-ci-x64-release/_deps/*-src
            out/build/windows-ci-x64-release/_deps/*-subbuild
            .nuget
          key: windows-x64-release-dep-sources-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('CMakeLists.txt', 'cmake/patches/**', 'cmake/ApplyGitPatch.cmake', 'ClientLibrary/**/*.csproj', 'ClientLibrary/**/*.props') }}
          restore-keys: windows-x64-release-dep-sources-

      - name: Restore vcpkg packages
        id: vcpkg_cache
        # Saved after the configure step, which builds what the archives lack, by main pushes only.
        uses: actions/cache/restore@v6
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-windows-x64-v2-${{ steps.vcpkg.outputs.identity }}-${{ hashFiles('vcpkg.json', 'toolchain-x64.cmake', 'cmake/triplets/**') }}
          restore-keys: vcpkg-windows-x64-v2-

      - name: Note when the caches were read
        id: caches_read
        # The prune job deletes an older entry whose last read was this job's; one read later stays for a later run.
        shell: pwsh
        run: |
          $at = [DateTime]::UtcNow.ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
          "at=$at" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # No warning may come back: the game's own code builds with warnings as errors, and ci_warnings.py fails the
      # step for any other warning, note or deprecation in the configure or build output (docs/build/README.md).
      # SDL and RmlUi build without their precompiled headers, which ccache does not cache: only the game's own
      # code would hit, and the two libraries' files, over a quarter of the build, compiled again on every run. The
      # nightly and manual release builds, which save no cache, keep them: local builds use them, and what ships
      # should be built the way they are, so a change that breaks only with them still fails a nightly.
      - name: Configure CMake
        run: >
          python scripts/ci_warnings.py run
          cmake --preset windows-x64
          -B out/build/windows-ci-x64-release
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=${{ needs.quality.outputs.release == 'true' && 'OFF' || 'ON' }}
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${{ github.workspace }}/toolchain-x64.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets
          -DVCPKG_INSTALLED_DIR=C:/vcpkg/installed
          -DVCPKG_MANIFEST_MODE=ON
          -DENABLE_EDITOR=OFF
          -DMU_WARNINGS_AS_ERRORS=ON
          -DMU_ENABLE_SHADER_COMPILATION=ON
          -DGLSLANG_EXE=C:/vcpkg/installed/x64-windows/tools/glslang/glslangValidator.exe
          -DSPIRV_CROSS_EXE=C:/vcpkg/installed/x64-windows/tools/spirv-cross/spirv-cross.exe
          -DDXC_EXE=C:/vcpkg/installed/x64-windows/tools/directx-dxc/dxc.exe
          -DMU_COPY_RUNTIME_ASSETS=OFF
          -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Assert configured MSVC compiler
        shell: pwsh
        run: |
          $buildDirectory = "out/build/windows-ci-x64-release"
          $compilerStates = @(
            Get-ChildItem `
              -Path "$buildDirectory/CMakeFiles/*/CMakeCXXCompiler.cmake" `
              -File
          )
          if ($compilerStates.Count -ne 1) {
            throw "Expected one top-level CMakeCXXCompiler.cmake; found $($compilerStates.Count)."
          }

          $compilerState = $compilerStates[0]
          $state = Get-Content -LiteralPath $compilerState.FullName -Raw
          if ($state -notmatch 'set\(CMAKE_CXX_COMPILER_ID "MSVC"\)') {
            throw "CMake did not configure the MSVC C++ compiler."
          }

          $compilerMatch = [regex]::Match(
            $state,
            'set\(CMAKE_CXX_COMPILER "([^"]+)"\)'
          )
          if (-not $compilerMatch.Success) {
            throw "CMake did not record the C++ compiler path."
          }

          $configuredCompiler = [IO.Path]::GetFullPath($compilerMatch.Groups[1].Value)
          $activeCompiler = [IO.Path]::GetFullPath(
            (Get-Command cl.exe -ErrorAction Stop).Source
          )
          Write-Host "CMake compiler ID: MSVC"
          Write-Host "CMake C++ compiler: $configuredCompiler"
          if (-not [StringComparer]::OrdinalIgnoreCase.Equals(
            $configuredCompiler,
            $activeCompiler
          )) {
            throw "CMake selected a compiler outside the active MSVC environment."
          }

      - name: Save vcpkg packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.vcpkg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            ~/AppData/Local/vcpkg/archives
          key: ${{ steps.vcpkg_cache.outputs.cache-primary-key }}

      - name: Build
        # Trim compiler cache keeps the objects used from here on.
        run: |
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "BUILD_STARTED=$started" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          ccache --zero-stats
          python scripts/ci_warnings.py run cmake --build out/build/windows-ci-x64-release --config Release

      - name: Report compiler cache
        if: always()
        shell: pwsh
        run: |
          if (Get-Command ccache -ErrorAction SilentlyContinue) {
            $stats = ccache --show-stats | Out-String
            Write-Host $stats
            "### Windows compiler cache", '```text', $stats.TrimEnd(), '```' |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Save dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            # Downloaded sources only: ninja recompiles restored *-build folders.
            out/build/windows-ci-x64-release/_deps/*-src
            out/build/windows-ci-x64-release/_deps/*-subbuild
            .nuget
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Run tests
        run: >
          ctest --test-dir out/build/windows-ci-x64-release --build-config Release
          --output-on-failure
          --no-tests=error
          --label-exclude static
          --parallel 4

      - name: Stage MSVC redistributable runtime
        shell: pwsh
        run: |
          $runtimeDirectory = "out/build/windows-ci-x64-release/src/Release"
          if (-not (Test-Path -LiteralPath $runtimeDirectory -PathType Container)) {
            throw "Missing native runtime directory: $runtimeDirectory"
          }
          if ([string]::IsNullOrWhiteSpace($env:VCToolsRedistDir)) {
            throw "VCToolsRedistDir is missing from the active MSVC developer environment."
          }

          $redistArchitectureDirectory = Join-Path $env:VCToolsRedistDir "x64"
          $crtDirectories = @(
            Get-ChildItem -LiteralPath $redistArchitectureDirectory -Directory -Filter "Microsoft.VC*.CRT"
          )
          if ($crtDirectories.Count -ne 1) {
            throw "Expected one active Microsoft.VC*.CRT directory under $redistArchitectureDirectory; found $($crtDirectories.Count)."
          }

          $crtDlls = @(
            Get-ChildItem -LiteralPath $crtDirectories[0].FullName -File -Filter "*.dll" |
              Sort-Object Name
          )
          if ($crtDlls.Count -eq 0) {
            throw "Active MSVC CRT directory contains no redistributable DLLs."
          }
          Copy-Item -LiteralPath $crtDlls.FullName -Destination $runtimeDirectory -Force

      - name: Validate artifacts
        shell: pwsh
        run: |
          $runtimeDirectory = "out/build/windows-ci-x64-release/src/Release"
          $requiredFiles = @(
            "$runtimeDirectory/Main.exe",
            "$runtimeDirectory/MUnique.Client.Library.dll",
            "$runtimeDirectory/config.ini"
          )
          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing required runtime file: $path"
            }
          }
          if (-not (Test-Path -LiteralPath "$runtimeDirectory/shaders" -PathType Container)) {
            throw "Missing required runtime directory: $runtimeDirectory/shaders"
          }
          foreach ($path in @("$runtimeDirectory/Data", "$runtimeDirectory/fonts")) {
            if (Test-Path -LiteralPath $path) {
              throw "Unexpected bundled game data: $path"
            }
          }

          $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source
          $expectedMachinePattern = '^\s*8664 machine \(x64\)\s*$' # 8664 machine (x64)
          if ([string]::IsNullOrWhiteSpace($env:WINDIR)) {
            throw "WINDIR is required for target Windows OS DLL validation."
          }
          if ([Environment]::Is64BitProcess) {
            $targetSystemDirectory = Join-Path $env:WINDIR "System32"
          } else {
            $targetSystemDirectory = Join-Path $env:WINDIR "Sysnative"
          }
          $windowsOsDlls = @(
            "advapi32.dll"
            "avrt.dll"
            "bcrypt.dll"
            "cfgmgr32.dll"
            "combase.dll"
            "comctl32.dll"
            "comdlg32.dll"
            "crypt32.dll"
            "d3d12.dll"
            "dbghelp.dll"
            "dinput8.dll"
            "dnsapi.dll"
            "dwmapi.dll"
            "dxcore.dll"
            "dxgi.dll"
            "dxguid.dll"
            "gdi32.dll"
            "glu32.dll"
            "hid.dll"
            "imagehlp.dll"
            "imm32.dll"
            "iphlpapi.dll"
            "kernel32.dll"
            "mf.dll"
            "mfplat.dll"
            "mfreadwrite.dll"
            "mfsensorgroup.dll"
            "msvcrt.dll"
            "normaliz.dll"
            "ntdll.dll"
            "ole32.dll"
            "oleaut32.dll"
            "opengl32.dll"
            "powrprof.dll"
            "propsys.dll"
            "rpcrt4.dll"
            "sechost.dll"
            "secur32.dll"
            "setupapi.dll"
            "shell32.dll"
            "shcore.dll"
            "shlwapi.dll"
            "ucrtbase.dll"
            "uiautomationcore.dll"
            "urlmon.dll"
            "user32.dll"
            "usp10.dll"
            "uuid.dll"
            "version.dll"
            "vfw32.dll"
            "wininet.dll"
            "winmm.dll"
            "wintrust.dll"
            "wldap32.dll"
            "ws2_32.dll"
            "wtsapi32.dll"
          )
          $windowsOsDllAllowlist = @{}
          foreach ($windowsOsDll in $windowsOsDlls) {
            $windowsOsDllAllowlist[$windowsOsDll] = $true
          }

          $rootRuntimeFiles = @{}
          Get-ChildItem -LiteralPath $runtimeDirectory -Force -File |
            ForEach-Object { $rootRuntimeFiles[$_.Name] = $_.FullName }
          $runtimeBinaries = @(
            Get-ChildItem -LiteralPath $runtimeDirectory -Force -File -Recurse |
              Where-Object { $_.Extension -in @(".exe", ".dll") } |
              Sort-Object FullName
          )
          if ($runtimeBinaries.Count -eq 0) {
            throw "Runtime directory contains no PE files: $runtimeDirectory"
          }

          $missingImports = @()
          foreach ($binary in $runtimeBinaries) {
            $headers = @(& $dumpbin /headers $binary.FullName 2>&1)
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin /headers failed for $($binary.FullName) with exit code $LASTEXITCODE."
            }
            $machineMatches = @($headers | Select-String -Pattern $expectedMachinePattern)
            if ($machineMatches.Count -ne 1) {
              throw "Unexpected PE architecture for $($binary.FullName); expected x64."
            }

            $dependents = @(& $dumpbin /DEPENDENTS $binary.FullName 2>&1)
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin /DEPENDENTS failed for $($binary.FullName) with exit code $LASTEXITCODE."
            }
            $dependencySection = [regex]::Match(
              ($dependents -join "`n"),
              '(?ms)^[ \t]*Image has the following dependencies:[ \t]*\r?\n(?<body>.*?)(?=^[ \t]*Summary[ \t]*$)'
            )
            if (-not $dependencySection.Success) {
              throw "Could not parse dumpbin dependency heading for $($binary.FullName)."
            }
            $imports = @(
              [regex]::Matches(
                $dependencySection.Groups["body"].Value,
                '(?im)^[ \t]*(?<name>[^ \t\r\n]+\.dll)[ \t]*$'
              ) |
                ForEach-Object { $_.Groups["name"].Value } |
                Sort-Object -Unique
            )
            foreach ($importName in $imports) {
              $importFileName = [IO.Path]::GetFileName($importName)
              if (
                [IO.Path]::IsPathRooted($importName) -or
                $importName.Contains('/') -or
                $importName.Contains('\') -or
                -not [StringComparer]::Ordinal.Equals($importFileName, $importName)
              ) {
                $missingImports += "$($binary.FullName): invalid import name: $importName"
                continue
              }
              if ($importName -match '^(?:ucrtbased|(?:vcruntime|msvcp|concrt|vcomp)[0-9]+(?:_[a-z0-9_]+)?d)\.dll$') {
                $missingImports += "$($binary.FullName): debug CRT import in Release runtime: $importName"
                continue
              }
              if ($rootRuntimeFiles.ContainsKey($importName)) {
                continue
              }
              if ($importName -match '^(?:vcruntime|msvcp|concrt|vcomp)[0-9]+(?:_[a-z0-9_]+)?\.dll$') {
                $missingImports += "$($binary.FullName): VC runtime import must be staged root-local: $importName"
                continue
              }
              if ($importName -like "api-ms-win-*" -or $importName -like "ext-ms-win-*") {
                continue
              }
              if ($windowsOsDllAllowlist.ContainsKey($importName)) {
                $systemDllPath = Join-Path $targetSystemDirectory $importName
                if (Test-Path -LiteralPath $systemDllPath -PathType Leaf) {
                  continue
                }
                $missingImports += "$($binary.FullName): allowlisted Windows OS DLL missing from target system directory: $importName"
                continue
              }
              $missingImports += "$($binary.FullName): $importName"
            }
          }
          $missingImports = @($missingImports | Sort-Object -Unique)
          if ($missingImports.Count -ne 0) {
            throw "Missing runtime imports:`n$($missingImports -join "`n")"
          }

          # The shader list lives in cmake/ValidateShaderBlobs.cmake, which the
          # build already runs on its own shader output. Running it on the
          # runtime copy checks that every listed .spv, .msl and .dxil blob is
          # there and valid and that no unlisted one is.
          $shaderDirectory = (Resolve-Path -LiteralPath "$runtimeDirectory/shaders").Path.Replace('\', '/')
          cmake "-DMU_SHADER_BLOB_DIR=$shaderDirectory" -P cmake/ValidateShaderBlobs.cmake
          if ($LASTEXITCODE -ne 0) {
            throw "Runtime shaders do not match cmake/ValidateShaderBlobs.cmake (exit code $LASTEXITCODE)."
          }
          $otherShaderEntries = @(
            Get-ChildItem -LiteralPath $shaderDirectory -Force -Recurse |
              Where-Object { $_.PSIsContainer -or $_.Extension -notin @(".spv", ".msl", ".dxil") } |
              ForEach-Object { $_.FullName }
          )
          if ($otherShaderEntries.Count -ne 0) {
            throw "Unexpected entries in the runtime shader directory:`n$($otherShaderEntries -join "`n")"
          }

          Write-Host "Validated native x64 runtime directory: $runtimeDirectory"

      - name: Trim compiler cache
        # ccache marks each object it finds or stores, so the objects from before this build are ones it no longer
        # uses. Without them a save holds this build's objects, not every build's since the cache began.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $age = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:BUILD_STARTED + 60
          ccache --evict-older-than "${age}s"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ccache --show-stats

      - name: Save Windows compilation cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      # Only the release runs hand their builds on, as on Linux and macOS.
      - name: Archive runtime
        if: needs.quality.outputs.release == 'true'
        run: tar -czf MuMain-windows-native-x64-release-editor-off-no-data.tar.gz -C out/build/windows-ci-x64-release/src/Release .

      - name: Upload runtime artifact
        if: needs.quality.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mu-client-windows-native-x64-release-editor-off-no-data-main
          path: MuMain-windows-native-x64-release-editor-off-no-data.tar.gz
          if-no-files-found: error

  build-linux:
    name: Linux Native Build (x64, Release, editor OFF)
    needs: quality
    if: needs.quality.outputs.linux == 'true'
    # By name, as Quality Gates: another image's GCC warns differently.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    outputs:
      caches-read-at: ${{ steps.caches_read.outputs.at }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build gcc g++ ccache \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev libpulse-dev \
            libssl-dev libcurl4-openssl-dev libturbojpeg0-dev libcrypto++-dev \
            glslang-tools spirv-cross \
            pkg-config

      - name: Identify compiler cache
        id: compiler
        run: echo "identity=$(sha256sum /usr/bin/gcc /usr/bin/g++ | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Linux compilation
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-x64-${{ steps.compiler.outputs.identity }}-${{ github.sha }}
          restore-keys: ccache-linux-x64-${{ steps.compiler.outputs.identity }}-

      - name: Restore dependencies
        id: deps
        # Named as on Windows; saved by main pushes, like the compiler cache (Save dependencies).
        uses: actions/cache/restore@v6
        with:
          path: |
            # Downloaded sources only: ninja recompiles restored *-build folders, and ccache covers that.
            out/build/linux-ci/_deps/*-src
            out/build/linux-ci/_deps/*-subbuild
            .nuget
          key: linux-x64-release-dep-sources-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('CMakeLists.txt', 'cmake/patches/**', 'cmake/ApplyGitPatch.cmake', 'ClientLibrary/**/*.csproj', 'ClientLibrary/**/*.props') }}
          restore-keys: linux-x64-release-dep-sources-

      - name: Note when the caches were read
        id: caches_read
        # The prune job deletes an older entry whose last read was this job's; one read later stays for a later run.
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # As on Windows: no warning may come back, and SDL and RmlUi build without precompiled headers except in the
      # release builds (docs/build/README.md).
      - name: Configure CMake
        run: >
          python3 scripts/ci_warnings.py run
          cmake --preset linux-x64
          -B out/build/linux-ci
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=${{ needs.quality.outputs.release == 'true' && 'OFF' || 'ON' }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DENABLE_EDITOR=OFF
          -DMU_WARNINGS_AS_ERRORS=ON
          -DMU_COPY_RUNTIME_ASSETS=OFF
          -DBUILD_TESTING=ON

      - name: Build
        # Trim compiler cache keeps the objects used from here on.
        run: |
          echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          ccache --zero-stats
          python3 scripts/ci_warnings.py run cmake --build out/build/linux-ci --config Release

      - name: Save dependencies
        # Not by the nightly: it runs beside the pushes in another concurrency group, so an older commit's entry could
        # be saved after a newer one and be the one the prune job keeps.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            # Downloaded sources only: ninja recompiles restored *-build folders, and ccache covers that.
            out/build/linux-ci/_deps/*-src
            out/build/linux-ci/_deps/*-subbuild
            .nuget
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Report compiler cache
        if: always()
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats
            {
              echo '### Linux compiler cache'
              echo '```text'
              ccache --show-stats
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run tests
        run: >
          ctest --test-dir out/build/linux-ci --build-config Release
          --output-on-failure
          --no-tests=error
          --label-exclude static
          --parallel 4

      - name: Validate runtime
        run: |
          runtime_directory="out/build/linux-ci/src/Release"
          for path in \
            "$runtime_directory/Main" \
            "$runtime_directory/MUnique.Client.Library.so" \
            "$runtime_directory/config.ini" \
            "$runtime_directory/shaders"
          do
            if [ ! -e "$path" ]; then
              echo "Missing required runtime path: $path" >&2
              exit 1
            fi
          done
          for path in "$runtime_directory/Data" "$runtime_directory/fonts"; do
            if [ -e "$path" ]; then
              echo "Unexpected bundled game data: $path" >&2
              exit 1
            fi
          done

      - name: Trim compiler cache
        # ccache marks each object it finds or stores, so the objects from before this build are ones it no longer
        # uses. Without them a save holds this build's objects, not every build's since the cache began.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        run: |
          ccache --evict-older-than "$(( $(date +%s) - BUILD_STARTED + 60 ))s"
          ccache --show-stats

      - name: Save Linux compilation cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Archive runtime
        if: needs.quality.outputs.release == 'true'
        run: tar -czf MuMain-linux-native-x64-release-editor-off-no-data.tar.gz -C out/build/linux-ci/src/Release .

      - name: Upload runtime artifact
        if: needs.quality.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mu-client-linux-native-x64-release-editor-off-no-data-main
          path: MuMain-linux-native-x64-release-editor-off-no-data.tar.gz
          if-no-files-found: error

  build-macos:
    name: macOS Native Build (arm64, Release, editor OFF)
    needs: quality
    if: needs.quality.outputs.macos == 'true'
    # By name: the build's minimum macOS is the image's (cmake/toolchains/macos-arm64.cmake), so it changes only
    # with this line, not when GitHub moves macos-latest to a newer macOS.
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      caches-read-at: ${{ steps.caches_read.outputs.at }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      # /usr/bin/clang++ is an xcrun shim, so hashing its content would miss Xcode updates.
      CCACHE_COMPILERCHECK: '%compiler% -v'
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install build tools
        # Only what the image lacks: brew warns about each formula that is already installed. --quiet leaves out the
        # caveats (ccache's explains its compiler symlinks, which the build does not use); warnings still show.
        run: |
          missing=()
          for formula in cmake ninja openssl@3 curl brotli glslang spirv-cross cryptopp ccache; do
            brew list --formula "$formula" >/dev/null 2>&1 || missing+=("$formula")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            brew install --quiet "${missing[@]}"
          fi

      - name: Identify compiler cache
        id: compiler
        run: echo "identity=$(shasum -a 256 "$(xcrun -f clang)" "$(xcrun -f clang++)" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache macOS compilation
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-arm64-${{ steps.compiler.outputs.identity }}-${{ github.sha }}
          restore-keys: ccache-macos-arm64-${{ steps.compiler.outputs.identity }}-

      - name: Restore dependencies
        id: deps
        # Named and saved as on Windows.
        uses: actions/cache/restore@v6
        with:
          path: |
            # Downloaded sources only: ninja recompiles restored *-build folders, and ccache covers that.
            out/build/macos-ci/_deps/*-src
            out/build/macos-ci/_deps/*-subbuild
            .nuget
          key: macos-arm64-release-dep-sources-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('CMakeLists.txt', 'cmake/patches/**', 'cmake/ApplyGitPatch.cmake', 'ClientLibrary/**/*.csproj', 'ClientLibrary/**/*.props') }}
          restore-keys: macos-arm64-release-dep-sources-

      - name: Note when the caches were read
        id: caches_read
        # The prune job deletes an older entry whose last read was this job's; one read later stays for a later run.
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # As on Windows: no warning may come back, and SDL and RmlUi build without precompiled headers except in the
      # release builds (docs/build/README.md).
      - name: Configure CMake
        run: >
          python3 scripts/ci_warnings.py run
          cmake --preset macos-arm64
          -B out/build/macos-ci
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=${{ needs.quality.outputs.release == 'true' && 'OFF' || 'ON' }}
          -DENABLE_EDITOR=OFF
          -DMU_WARNINGS_AS_ERRORS=ON
          -DMU_COPY_RUNTIME_ASSETS=OFF
          -DBUILD_TESTING=ON
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        # Trim compiler cache keeps the objects used from here on.
        run: |
          echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          ccache --zero-stats
          python3 scripts/ci_warnings.py run cmake --build out/build/macos-ci --config Release

      - name: Save dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            # Downloaded sources only: ninja recompiles restored *-build folders, and ccache covers that.
            out/build/macos-ci/_deps/*-src
            out/build/macos-ci/_deps/*-subbuild
            .nuget
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Report compiler cache
        if: always()
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats
            {
              echo '### macOS compiler cache'
              echo '```text'
              ccache --show-stats
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run tests
        run: >
          ctest --test-dir out/build/macos-ci --build-config Release
          --output-on-failure
          --no-tests=error
          --label-exclude static
          --parallel 4

      - name: Validate runtime
        run: |
          runtime_directory="out/build/macos-ci/src/Release/Main.app/Contents/MacOS"
          for path in \
            "$runtime_directory/Main" \
            "$runtime_directory/MUnique.Client.Library.dylib" \
            "$runtime_directory/config.ini" \
            "$runtime_directory/shaders"
          do
            if [ ! -e "$path" ]; then
              echo "Missing required runtime path: $path" >&2
              exit 1
            fi
          done
          for path in "$runtime_directory/Data" "$runtime_directory/fonts"; do
            if [ -e "$path" ]; then
              echo "Unexpected bundled game data: $path" >&2
              exit 1
            fi
          done

      - name: Trim compiler cache
        # ccache marks each object it finds or stores, so the objects from before this build are ones it no longer
        # uses. Without them a save holds this build's objects, not every build's since the cache began.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        run: |
          ccache --evict-older-than "$(( $(date +%s) - BUILD_STARTED + 60 ))s"
          ccache --show-stats

      - name: Save macOS compilation cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Archive runtime
        if: needs.quality.outputs.release == 'true'
        run: tar -czf MuMain-macos-native-arm64-release-editor-off-no-data.tar.gz -C out/build/macos-ci/src/Release Main.app

      - name: Upload runtime artifact
        if: needs.quality.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mu-client-macos-native-arm64-release-editor-off-no-data-main
          path: MuMain-macos-native-arm64-release-editor-off-no-data.tar.gz
          if-no-files-found: error

  # A save under a new key leaves the older entries of that cache behind, e.g. a compiler cache for each main push.
  # They are deleted here, in a job of their own, so that the build jobs keep a read-only token.
  caches:
    name: Prune caches
    needs: [build-windows, build-linux, build-macos]
    # PR runs save no cache.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      # The script and what it imports, without the game data; and no token left in .git/config, as this one can
      # delete caches.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Delete older cache entries
        env:
          GH_TOKEN: ${{ github.token }}
          # When each build job's restores ended, empty for a job that did not run.
          CACHES_READ_AT_LINUX: ${{ needs.build-linux.outputs.caches-read-at }}
          CACHES_READ_AT_MACOS: ${{ needs.build-macos.outputs.caches-read-at }}
          CACHES_READ_AT_WINDOWS: ${{ needs.build-windows.outputs.caches-read-at }}
        run: python3 scripts/ci_cache_prune.py

  required:
    name: CI Required
    # The prune job too: its failures and warning annotations count like a build's. Without it running, the caches
    # fill up again and push main's entries out.
    needs: [quality, build-windows, build-linux, build-macos, caches]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Reading the other jobs' annotations.
      actions: read
      checks: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify applicable checks
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_build_plan.py check

      # GitHub's own warnings count too, e.g. that an action targets a deprecated Node.js version.
      - name: Check job annotations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_job_annotations.py

  release:
    name: Semantic Release
    needs: [quality, build-windows, build-linux, build-macos, required]
    if: needs.quality.outputs.release == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Windows runtime archive
        uses: actions/download-artifact@v4
        with:
          name: mu-client-windows-native-x64-release-editor-off-no-data-main
          path: .

      - name: Download Linux runtime archive
        uses: actions/download-artifact@v4
        with:
          name: mu-client-linux-native-x64-release-editor-off-no-data-main
          path: .

      - name: Download macOS runtime archive
        uses: actions/download-artifact@v4
        with:
          name: mu-client-macos-native-arm64-release-editor-off-no-data-main
          path: .

      - name: Resolve compatible data release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          data_tree=$(git rev-parse HEAD:src/bin/Data)
          fonts_tree=$(git rev-parse HEAD:src/bin/fonts)
          asset_id=$(printf '%s\n%s\n' "$data_tree" "$fonts_tree" | sha256sum | cut -c1-16)
          data_tag="data-${asset_id}"
          data_release_url=$(gh release view "$data_tag" --json url --jq .url)

          {
            echo "DATA_ASSET_ID=${asset_id}"
            echo "DATA_RELEASE_URL=${data_release_url}"
          } >> "$GITHUB_ENV"

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check unpublished release revision
        if: steps.semantic.outputs.new_release_published != 'true'
        run: python3 scripts/ci_build_plan.py check-release

      - name: Link compatible data release
        if: steps.semantic.outputs.new_release_published == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
        run: |
          # ponytail: post-publish edit; use a generateNotes plugin if note updates become concurrent.
          release_notes="${RUNNER_TEMP}/MuMain-release-notes.md"
          gh release view "$RELEASE_TAG" --json body --jq .body > "$release_notes"
          {
            printf '\n## Compatible game data\n\n'
            # shellcheck disable=SC2016
            printf '[Download `MuMain-data-%s.tar.gz` and its checksum](%s).\n' "$DATA_ASSET_ID" "$DATA_RELEASE_URL"
          } >> "$release_notes"
          gh release edit "$RELEASE_TAG" --notes-file "$release_notes"
