; Classic (0.97) tokens: only what differs from legacy (ThemeInheritance.h resolves the rest).
; The current client draws its text in Verdana 13 px (Main.dll Font.cpp); theme.ini's [Fonts]
; loads it from the system. Where it is missing RmlUi falls back to the bundled face.
[Tokens]
font-title=Verdana
font-body=Verdana

; The server buttons' colors in 0.97 (server_select.rcss); silver is legacy's.
server-button=#ffffb3
server-button-gray=#ffffff
server-button-orange=#ffb27f

; The load bar of 0.97 (server_select.rcss): the ends of its gradient, and its track.
server-load-base=#00ffff
server-load-full=#ff0000
server-load-empty=#1a1a1a
