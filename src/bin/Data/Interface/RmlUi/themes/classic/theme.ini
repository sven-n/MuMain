; The classic 0.97 interface. It builds on legacy (ThemeInheritance.h): a window this theme does
; not restyle keeps legacy's look, so the theme ships only what it changes. Its art is the 0.97
; client's, in Data/Interface/Classic (interface) and Data/Logo/Classic (login box and character select).
[Theme]
Base=legacy

; 0.97 draws the chat's input box over the bar (its foot on the bar's top), so it goes over the
; windows, the HUD and the command windows (10.65), and under the settings window (10.67) and the
; tooltips (10.69).
[Stacking]
chat_input.rml=10.66

; The classic client font, Verdana, taken from the player's Windows (it may not be shipped);
; tokens.ini names it, and the bundled face stands in where the file is missing
; (UI/RmlBridge/ThemeFonts.h, one file per key).
[Fonts]
Verdana=%WINDIR%\Fonts\verdana.ttf
VerdanaBold=%WINDIR%\Fonts\verdanab.ttf

[Meta]
DisplayName=Classic (0.97)
