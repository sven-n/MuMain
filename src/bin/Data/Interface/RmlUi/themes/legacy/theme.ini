; Declared theme capabilities (architecture-principles.md §30, read in RmlTheme.cpp). Optional: a
; theme that doesn't need this file gets the safe default (0/false) for every key.

; NativeTextSize=1: documents whose <body> has class "native-text" get the original client's text
; size as their root font-size, and this theme sizes their text in rem (RmlNativeText.h); elements
; with class "native-fit" shrink their one-line text to their box like the original (RmlNativeTextFit.h).
[Capabilities]
NativeTextSize=1

; Read by UI::RmlBridge::GetThemeDisplayName() -- the label COptionWindow's UI Theme dropdown
; shows for this theme. Optional: a theme with no [Meta]/DisplayName falls back to its own folder
; name, capitalized.
[Meta]
DisplayName=Legacy
