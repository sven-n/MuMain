; Declared theme capabilities (architecture-principles.md §30 -- read by
; UI::RmlBridge::ThemeProvidesOwnIconChrome(), RmlTheme.cpp). Optional: a theme that doesn't need
; this file gets the safe default (0/false) for every key. Legacy leaves ProvidesOwnIconChrome off --
; it still draws the real legacy sprite icon chrome, the default.

; NativeTextSize=1: documents whose <body> has class "native-text" get the original client's text
; size as their root font-size, and this theme sizes their text in rem (RmlNativeText.h).
[Capabilities]
NativeTextSize=1

; Read by UI::RmlBridge::GetThemeDisplayName() -- the label COptionWindow's UI Theme dropdown
; shows for this theme. Optional: a theme with no [Meta]/DisplayName falls back to its own folder
; name, capitalized.
[Meta]
DisplayName=Legacy
