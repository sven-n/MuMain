; Design tokens (architecture-principles.md §21, modern-theme-visual-direction.md) -- read by
; token(name) markers in this theme's own .rcss files, resolved by
; UI::RmlBridge::InlineTokenizedStylesheet() (RmlTheme.cpp) before RmlUi ever sees the text.
; This file's values ARE modern-theme-visual-direction.md's token tables -- that document stays
; the source of truth for what each token means/is used for; keep this file in sync with it.
; `legacy` has no token layer and isn't in scope for one (theme-specific by design).
;
; Second generation palette: blackened iron / dark forged metal, replacing the first generation's
; cool-steel/blue-gray direction. Every name below was chosen to be self-describing rather than
; screen-specific -- a consuming .rcss file should be able to pick the right token from its name
; alone, without checking this file's own comments first.
[Tokens]

; Surfaces
surface-deep=#060706
surface-recessed=#0a0c0b
surface-panel=#111310
surface-raised=#20221d
surface-control=rgba(255, 255, 255, 10)
surface-tooltip=rgba(6, 7, 6, 247)

; Metal / frame -- the structural iron material itself, not interactive-accent chrome (that's
; accent-steel below). metal-edge/metal-highlight are progressively brighter bevel catches on a
; raised surface (dim to bright); metal-warm-edge is the sparingly-used ornamental brass/iron tone
; (header accent lines, hero-banner corner ornaments) -- not a general-purpose border color.
metal-dark=#13140f
metal-mid=#46463b
metal-edge=#5c6058
metal-highlight=#96998e
metal-warm-edge=#6b6045
; Added for the login dialog's explicit shell/rail/plate layers (base.rcss's own forged-dialog
; construction primitives) -- each name matches the class it exists for, not a general-purpose
; re-tint of an existing metal-* tone.
metal-outer=#090a08
metal-groove=#171914
metal-rail=#24241d
metal-rail-dark=#0d0f0c
metal-title-face=#2e0c08
metal-title-face-dark=#160706

; Text -- text-warm is the only warm text token (titles/names/labels/emphasis-critical text);
; text-primary/-secondary/-muted are a neutral gray scale for general body/description/metadata
; text, not a blanket "everything warm" rule.
text-primary=#d6d2c6
text-secondary=#aaa79d
text-muted=#77766f
text-warm=#d6ad45
text-disabled=#4a4a44

; Accent colors -- three families, not interchangeable (see modern-theme-visual-direction.md):
; accent-steel for general interactive chrome, accent-crimson for a window's one primary/hero
; action, accent-gold for selected/checked/emphasis states.
accent-steel=#747b74
accent-steel-hover=#a5aaa0
accent-crimson=#7d190f
accent-crimson-hover=#c34a2d
accent-gold=#c49a3c
accent-gold-hover=#e2c16d

; Semantic colors -- communicate state/meaning, not decoration.
semantic-success=#8eb06b
semantic-warning=#c99a3e
semantic-danger=#a22c1e
semantic-rare=#9a6bc0
semantic-neutral=#6a6a63

; Borders -- border-frame is the general-purpose visible iron edge (window/dialog outer frames,
; buttons, checkboxes, tooltips, HUD panels -- the reference uses close to this one tone almost
; everywhere a border is actually meant to be seen). border-inner is reserved specifically for a
; RECESSED content-well edge (a sunken area inside a frame, e.g. a future .modern-panel/input-well
; border) -- distinct from border-frame's raised/visible role, not yet forced onto every screen.
; border-recessed is a barely-visible hairline divider. border-hover/-selected are explicit
; interaction-state borders (previously an inline reuse of an accent token at each call site --
; named explicitly now so a call site's intent reads directly).
border-frame=#46463b
border-inner=#292a23
border-recessed=#22231d
border-hover=#776646
border-selected=#b48a32
; Same forged-dialog-construction addition as the metal-* tokens above.
border-outer=#1f1f1a
border-rail=#39372b
border-title=#532118

; HUD resource colors -- previously literal, un-tokenized hex scattered across main_frame.rcss;
; promoted here so a HUD gauge's color has a name, same as everything else. Still deliberately
; distinct from the accent-* family -- these mean "this specific stat," not general UI emphasis.
resource-hp=#94150f
resource-mp=#224c9d
resource-sd=#d09b35
resource-ag=#af8630

; Radius -- deliberately unitless: call sites append their own dp/px (token(radius-sm)dp or
; token(radius-sm)px) since different windows use different units for this same value depending
; on that file's own dp-vs-px convention (see docs/rmlui-ui-system/layout-and-scaling.md). Shrunk
; from the first generation's 3/4 to 1/2 -- a carved-iron plate reads sharp-edged, not
; soft-rounded.
radius-sm=1
radius-md=2

; Typography -- modern-theme-visual-direction.md's "Typography — open item" section: both stay
; "Liberation Sans" (no distinct display font chosen yet) under a title/body naming split so a
; future asset swap is a one-line change instead of a grep-and-replace.
font-title=Liberation Sans
font-body=Liberation Sans
