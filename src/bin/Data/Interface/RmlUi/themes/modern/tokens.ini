; Design tokens (architecture-principles.md §21, modern-theme-visual-direction.md) -- read by
; token(name) markers in this theme's own .rcss files, resolved by
; UI::RmlBridge::InlineTokenizedStylesheet() (RmlTheme.cpp) before RmlUi ever sees the text.
; This file's values ARE modern-theme-visual-direction.md's token tables -- that document stays
; the source of truth for what each token means/is used for; keep this file in sync with it.
; `legacy` has no token layer and isn't in scope for one (theme-specific by design).
[Tokens]

; Surfaces
surface-0=rgba(9, 11, 14, 190)
surface-1=#12151a
surface-2=#1d232b
surface-3=rgba(255, 255, 255, 12)
surface-tooltip=rgba(10, 12, 15, 235)

; Accent colors
accent-steel=#76889a
accent-steel-bright=#aab8c6
accent-crimson=#a52336
accent-crimson-bright=#d34a5e
accent-gold=#d1aa55
accent-gold-bright=#ecd28a
accent-blue=#5a8fc0

; Semantic colors
semantic-success=#66956d
semantic-warning=#d69a3e
semantic-danger=#cb4855
semantic-rare=#9a6bc0
semantic-neutral=#8a9099

; Text -- text-emphasis is documented as "accent-gold (#d1aa55)"; resolved to the literal here
; since token(...) substitution is one level, not recursive. text-title is the only warm text
; token (titles/names/labels); text-body/text-muted are cool gray-blue, matching general
; description/stat text, not a blanket "everything warm" rule.
text-title=#d8bd7a
text-body=#a5adb7
text-muted=#717a84
text-emphasis=#d1aa55

; Borders
border-subtle=rgba(255, 255, 255, 12)
border-metal=rgba(122, 133, 145, 130)
border-strong=rgba(150, 161, 172, 180)

; Radius -- deliberately unitless: call sites append their own dp/px (token(radius-sm)dp or
; token(radius-sm)px) since different windows use different units for this same value depending
; on that file's own dp-vs-px convention (see docs/rmlui-ui-system/layout-and-scaling.md).
radius-sm=3
radius-md=4

; Typography -- modern-theme-visual-direction.md's "Typography — open item" section: both stay
; "Liberation Sans" (no distinct display font chosen yet) under a title/body naming split so a
; future asset swap is a one-line change instead of a grep-and-replace.
font-title=Liberation Sans
font-body=Liberation Sans
